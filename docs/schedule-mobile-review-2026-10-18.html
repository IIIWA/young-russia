<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Расписание ПМК «Морской» на телефоне</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#18243b;background:#eee8e3}
    *{box-sizing:border-box}body{margin:0}
    main{max-width:900px;margin:auto;padding:30px 20px 60px}
    h1{font-size:clamp(28px,4vw,38px);line-height:1.1;margin:0 0 12px;text-wrap:balance}
    .intro{max-width:680px;line-height:1.5;color:#596475;margin:0 0 28px;text-wrap:pretty}
    a{color:#7d2635}
    .phone{width:min(390px,100%);margin:auto;border:10px solid #fff;border-radius:35px;background:#faf8f1;box-shadow:0 18px 55px #4c303026;overflow:hidden}
    .phone-content{padding:20px 14px 24px}
    .phone-label{margin:0 0 7px;color:#8d4251;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
    .phone-title{font-size:28px;line-height:1.1;margin:0 0 16px;text-wrap:balance}
    figure{margin:0;border:1px solid #edd6d3;border-radius:12px;overflow:hidden;background:#fff}
    figure a{display:block;cursor:zoom-in}figure img{display:block;width:100%;height:auto}
    figcaption{padding:11px 12px;font-size:13px;line-height:1.45;color:#674d54}
    @media(max-width:500px){:root{background:#faf8f1}main{padding:0}.intro,main>h1{display:none}.phone{width:100%;border:0;border-radius:0;box-shadow:none}.phone-content{padding:22px 16px 32px}}
  </style>
</head>
<body>
  <main>
    <h1>Расписание на&nbsp;телефоне</h1>
    <p class="intro">На&nbsp;телефоне показана та&nbsp;же таблица, что и&nbsp;на&nbsp;компьютере. Изображение можно открыть целиком и&nbsp;увеличить. <a href="schedule-palette-review-2026-10-18.html">Вернуться к&nbsp;галерее</a>.</p>
    <div class="phone">
      <div class="phone-content">
        <p class="phone-label">ПМК «Морской»</p>
        <h2 class="phone-title">Расписание разговорного клуба</h2>
        <figure>
          <a href="../assets/schedules/morskoy-schedule-wide-time-column.png" target="_blank" rel="noopener" aria-label="Открыть полное изображение расписания для увеличения"><img src="../assets/schedules/morskoy-schedule-wide-time-column.png" width="1586" height="992" alt="Расписание английского и немецкого языков по дням недели"></a>
          <figcaption>Нажми на&nbsp;изображение, чтобы открыть его крупнее.</figcaption>
        </figure>
      </div>
    </div>
  </main>
</body>
</html>
